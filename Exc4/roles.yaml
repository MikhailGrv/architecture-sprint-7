# sprint-7-exc4 role.yaml

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-reader
rules:
- apiGroups: [""]
  resources: ["pods", "services", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"] 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "services", "deployments", "replicasets", "statefulsets", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["*"]
